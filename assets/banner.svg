<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b19" />
      <stop offset="40%" stop-color="#0c142c" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="violetGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b224ef" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#7579ff" stop-opacity="0.2" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(56, 189, 248, 0.07)" stroke-width="1" />
    </pattern>

    <!-- Hologram Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 44px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 18px;
      fill: #94a3b8;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
    .hud-text {
      font-family: "SF Mono", Monaco, Consolas, monospace;
      font-size: 11px;
      fill: #38bdf8;
      letter-spacing: 1.5px;
    }

    /* Ambient Pulsing & Dynamic Floating Animations */
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.45; }
      50% { transform: scale(1.18) translate(15px, -10px); opacity: 0.7; }
    }
    @keyframes floatCrosshair {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(180deg); }
    }
    @keyframes scanLine {
      0% { transform: translateY(0px); opacity: 0.8; }
      50% { opacity: 0.2; }
      100% { transform: translateY(380px); opacity: 0.8; }
    }
    @keyframes radarSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes hudPing {
      0% { r: 4px; opacity: 1; }
      100% { r: 24px; opacity: 0; }
    }

    .orb-1 { animation: pulseOrb 8s ease-in-out infinite; transform-origin: 200px 100px; }
    .orb-2 { animation: pulseOrb 10s ease-in-out infinite alternate; transform-origin: 1000px 300px; }
    .reticle-spin { animation: radarSpin 24s linear infinite; transform-origin: 1020px 210px; }
    .scanner-beam { animation: scanLine 6s ease-in-out infinite; }
    .ping-circle { animation: hudPing 2.5s cubic-bezier(0, 0.2, 0.8, 1) infinite; }
  </style>

  <!-- Base Canvas -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />
  <rect width="1200" height="420" fill="url(#cyberGrid)" />

  <!-- Ambient Dynamic Glowing Orbs (in deep background) -->
  <circle class="orb-1" cx="220" cy="120" r="140" fill="url(#cyanGlow)" filter="url(#glow)" />
  <circle class="orb-2" cx="1020" cy="240" r="180" fill="url(#violetGlow)" filter="url(#glow)" />

  <!-- Animated Scanning Laser Beam (Subtle Background Effect) -->
  <line class="scanner-beam" x1="0" y1="20" x2="1200" y2="20" stroke="rgba(56, 189, 248, 0.18)" stroke-width="2" />

  <!-- Interactive AR Reticle & Spatial HUD Graphics (Right Canvas Area) -->
  <g class="reticle-spin" opacity="0.65">
    <circle cx="1020" cy="210" r="120" fill="none" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1.5" stroke-dasharray="8 6" />
    <circle cx="1020" cy="210" r="90" fill="none" stroke="rgba(192, 132, 252, 0.35)" stroke-width="1" stroke-dasharray="16 8" />
    <circle cx="1020" cy="210" r="60" fill="none" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5" />
    <line x1="1020" y1="80" x2="1020" y2="340" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1" />
    <line x1="890" y1="210" x2="1150" y2="210" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1" />
  </g>

  <!-- AR Spatial Targets & Floating Markers -->
  <g transform="translate(1020, 210)">
    <circle class="ping-circle" cx="0" cy="0" r="6" fill="none" stroke="#38bdf8" stroke-width="2" />
    <circle cx="0" cy="0" r="5" fill="#38bdf8" />
    <!-- 3D Spatial Bounding Box Overlay -->
    <path d="M -45 -45 L -25 -45 M -45 -45 L -45 -25" stroke="#38bdf8" stroke-width="2.5" fill="none" />
    <path d="M 45 -45 L 25 -45 M 45 -45 L 45 -25" stroke="#38bdf8" stroke-width="2.5" fill="none" />
    <path d="M -45 45 L -25 45 M -45 45 L -45 25" stroke="#38bdf8" stroke-width="2.5" fill="none" />
    <path d="M 45 45 L 25 45 M 45 45 L 45 25" stroke="#38bdf8" stroke-width="2.5" fill="none" />
  </g>

  <text x="965" y="145" class="hud-text">TARGET: SPATIAL LOCK</text>
  <text x="980" y="285" class="hud-text">LATENCY &lt; 20MS</text>
  <text x="990" y="302" class="hud-text">WEBRTC P2P: ACTIVE</text>

  <!-- ================= FOREGROUND HERO CONTENT ================= -->
  <!-- Status Badge Pill -->
  <g transform="translate(80, 58)">
    <rect width="260" height="32" rx="16" fill="rgba(30, 41, 59, 0.85)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" />
    <circle cx="18" cy="16" r="4.5" fill="#10b981" />
    <text x="32" y="21" class="hud-text" fill="#38bdf8" font-weight="700">CURATED AR ECOSYSTEM</text>
  </g>

  <!-- Main Banner Title (Clean Foreground) -->
  <text x="80" y="145" class="title-text">
    Augmented Reality (AR)
  </text>
  <text x="80" y="198" class="title-text" fill="url(#accentGrad)">
    Remote Assistance
  </text>

  <!-- Tagline / Subtitle -->
  <text x="80" y="246" class="subtitle-text">
    Enterprise Telepresence, Spatial Guidance, Smart Glasses &amp; Open-Source SDKs
  </text>

  <!-- Interactive Feature Pills -->
  <g transform="translate(80, 280)">
    <!-- Pill 1: 3D Spatial Telestration -->
    <g transform="translate(0, 0)">
      <rect width="186" height="38" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.2" />
      <text x="18" y="24" class="pill-text">🎯 Spatial Telestration</text>
    </g>

    <!-- Pill 2: WebRTC Video Guidance -->
    <g transform="translate(198, 0)">
      <rect width="194" height="38" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(129, 140, 248, 0.3)" stroke-width="1.2" />
      <text x="18" y="24" class="pill-text">⚡ Real-Time WebRTC</text>
    </g>

    <!-- Pill 3: Smart Glasses & Wearables -->
    <g transform="translate(404, 0)">
      <rect width="176" height="38" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(192, 132, 252, 0.3)" stroke-width="1.2" />
      <text x="18" y="24" class="pill-text">👓 Smart Glasses</text>
    </g>

    <!-- Pill 4: Open Source & SDKs -->
    <g transform="translate(592, 0)">
      <rect width="180" height="38" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(52, 211, 153, 0.3)" stroke-width="1.2" />
      <text x="18" y="24" class="pill-text">🛠️ Open-Source SDKs</text>
    </g>
  </g>

  <!-- Bottom Accent Hologram Divider -->
  <line x1="80" y1="365" x2="1120" y2="365" stroke="url(#accentGrad)" stroke-width="2" stroke-linecap="round" opacity="0.85" />
</svg>
